services:
  postgres:
    image: postgres:16-alpine
    container_name: usine_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-usine_connectee}
      POSTGRES_USER: ${PGUSER:-usine_admin}
      POSTGRES_PASSWORD: ${PGPASSWORD:-usine_pass}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - pg_usine_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: usine_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  pg_usine_data: