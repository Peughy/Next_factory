<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#edf5ff" />
  <title>{{ title }} · FOYER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body data-page="{{ page }}">
  <div class="grain" aria-hidden="true"></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="{{ url_for('dashboard') }}">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none"><path d="M5 15.5 16 6l11 9.5V27a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V15.5Z" stroke="currentColor" stroke-width="1.7"/><path d="M12 28v-8h8v8" stroke="currentColor" stroke-width="1.7"/></svg>
        </span>
        <span>
          <strong>HUB</strong>
          <small>Entreprise connectée</small>
        </span>
      </a>
      <nav class="side-nav">
        <a href="{{ url_for('dashboard') }}" class="{% if page == 'dashboard' %}active{% endif %}">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5Z" stroke="currentColor" stroke-width="1.6"/></svg>
          Tableau de bord
        </a>
        <a href="{{ url_for('security') }}" class="{% if page == 'security' %}active{% endif %}">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 3 5 6.5v5.2c0 4.1 2.8 7.8 7 8.8 4.2-1 7-4.7 7-8.8V6.5L12 3Z" stroke="currentColor" stroke-width="1.6"/></svg>
          Sécurité
        </a>
        <a href="{{ url_for('climate') }}" class="{% if page == 'climate' %}active{% endif %}">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v10.2a3.5 3.5 0 1 0 2 0V3h-2Z" stroke="currentColor" stroke-width="1.6"/><path d="M9 6.5h6M9 9.5h6" stroke="currentColor" stroke-width="1.6"/></svg>
          Climat
        </a>
        <a href="{{ url_for('scenes') }}" class="{% if page == 'scenes' %}active{% endif %}">
          <svg viewBox="0 0 24 24" fill="none"><path d="M5 7h14M5 12h10M5 17h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          Scénarios
        </a>
        <a href="{{ url_for('activity') }}" class="{% if page == 'activity' %}active{% endif %}">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 19V5m0 14h16M8 15l3-4 3 2 4-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Activité
        </a>
        <a href="{{ url_for('settings') }}" class="{% if page == 'settings' %}active{% endif %}">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M12 4.5v2M12 17.5v2M4.5 12h2M17.5 12h2M6.4 6.4l1.4 1.4M16.2 16.2l1.4 1.4M17.6 6.4l-1.4 1.4M7.8 16.2l-1.4 1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          Paramètres
        </a>
      </nav>
      <div class="sidebar-foot">
        <div class="presence-pill" id="presence-pill">
          <span class="dot"></span>
          <span id="presence-label">Équipe présente</span>
        </div>
      </div>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Ouvrir le menu">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
        <div class="topbar-copy">
          <p class="eyebrow" id="house-name">Résidence Horizon</p>
          <h1>{{ title }}</h1>
        </div>
        <div class="topbar-actions">
          <div class="clock" id="clock">--:--</div>
          <button class="btn ghost" data-action="arm-toggle" id="arm-btn">Alarme</button>
        </div>
      </header>

      <div class="alert-strip hidden" id="alert-strip" role="status">
        <span id="alert-text">Alerte</span>
        <button class="btn small" data-action="ack">Acquitter</button>
      </div>

      <main class="page">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <nav class="tabbar" aria-label="Navigation mobile">
    <a href="{{ url_for('dashboard') }}" class="{% if page == 'dashboard' %}active{% endif %}">Accueil</a>
    <a href="{{ url_for('security') }}" class="{% if page == 'security' %}active{% endif %}">Sécurité</a>
    <a href="{{ url_for('scenes') }}" class="{% if page == 'scenes' %}active{% endif %}">Scènes</a>
    <a href="{{ url_for('climate') }}" class="{% if page == 'climate' %}active{% endif %}">Climat</a>
    <a href="{{ url_for('activity') }}" class="{% if page == 'activity' %}active{% endif %}">Activité</a>
  </nav>

  <div class="toast" id="toast" role="status"></div>
  <script>window.__FOYER__ = {{ boot | tojson }};</script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
